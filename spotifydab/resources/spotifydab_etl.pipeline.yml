# The main pipeline for spotifydab

resources:
  pipelines:
    spotifydab_etl:
      name: spotifydab_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/spotifydab_etl"

      libraries:
        - glob:
            include: ../src/spotifydab_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
